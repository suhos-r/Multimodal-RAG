name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (test deps only — no model downloads)
        run: pip install fastapi uvicorn sqlalchemy aiosqlite asyncpg pydantic pydantic-settings python-jose "bcrypt==4.0.1" passlib email-validator python-multipart httpx pytest pytest-asyncio
        working-directory: backend
      - name: Unit + integration tests (mocked LLM, sqlite)
        run: python -m pytest tests -q -p no:cacheprovider
        working-directory: backend
      - name: Chunking benchmark eval gate (blocks on quality drop)
        run: python evals/eval_gates.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
